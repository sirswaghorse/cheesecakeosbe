[package]
name = "cheesecake-os"
version = "0.1.0"
description = "Cheesecake OS Blueberry Edition Linux desktop host"
edition = "2021"
rust-version = "1.88"

[lib]
name = "cheesecake_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
dirs = "6"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

[dev-dependencies]
serde_json = "1"